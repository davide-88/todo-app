services:
  postgres:
    image: postgres:18-alpine3.22
    environment:
      POSTGRES_DB: todoapp
      POSTGRES_USER: todoapp
      POSTGRES_PASSWORD: todoapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoapp -d todoapp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://todoapp:todoapp@postgres:5432/todoapp
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173
      RATE_LIMIT_MAX: 100
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
